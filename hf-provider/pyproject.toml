# pyproject.toml
# ------------------------------
# Build backend & packaging
# ------------------------------
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------
# Project metadata (PEP 621)
# ------------------------------
[project]
name = "google-symphony-hf"
version = "0.3.7"
description = "IBM Spectrum Symphony Connectors for Google Cloud let you add compute resources from Google Cloud to your Symphony clusters. When your high performance computing (HPC) workloads need more capacity than your existing infrastructure provides, the connectors let Symphony's host factory service automatically provision Compute Engine virtual machines (VM) instances or pods in Google Kubernetes Engine (GKE). This approach lets you scale your Symphony environment into Google Cloud to meet peak demand for your HPC workloads."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.9.*"

authors = [
    { name = "Lineberry, Casey", email = "casey.lineberry@accenture.com" },
    { name = "Kim, Cory", email = "cory.y.kim@accenture.com" },
]

dependencies = [
    "importlib-metadata>=8.7.0",
    "kubernetes==32.0.1",
    "pydantic==2.11.4",
    "python-dotenv==1.1.0",
    "PyYAML==6.0.2",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "typing-extensions>=4.0.0",
    "google-cloud-compute>=1.31.0",
    "google-cloud-pubsub>=2.30.0",
    "tenacity>=9.1.2",
    "google-auth>=2.40.3",
    "python-debouncer>=0.1.5",
]

# Optional extras (unchanged)
[project.optional-dependencies]
api = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

# Console entry points
[project.scripts]
hf-gce = "gce_provider.__main__:main"
hf-monitor = "gce_provider.pubsub:main"
hf-gke = "gke_provider.__main__:main"
# backward compatibility; slated for removal later
gcphf  = "gke_provider.__main__:main"

# (Optional but nice)
[project.urls]
Homepage = "https://docs.cloud.google.com/compute/docs/instances/ibm-symphony/overview"
Repository = "https://github.com/google/symphony-gcp"

# ------------------------------
# Setuptools: src/ discovery & data files
# ------------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

# Include non-code files inside wheels/sdists (helpful for non-frozen runs)
[tool.setuptools.package-data]
gce_provider = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]
gke_provider = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.txt"]

# If you want to exclude tests from wheels:
#[tool.setuptools.exclude-package-data]
#* = ["tests/*", "test_*"]

# ------------------------------
# Dev tooling (unchanged)
# ------------------------------
[tool.black]
line-length = 100

[tool.flake8]
max-line-length = 100

[tool.isort]
profile = "black"

[tool.uv]
required-version="==0.11.26"