---
name: RPM Build
on: 
  workflow_dispatch:
  push:
    paths:
      - hf-provider/**

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ["8", "9", "10"]
        include:
          - python_pkg: python39
            version: 8
          - python_pkg: python39
            version: 9
          - python_pkg: python3
            version: 10
    container:
      image: rockylinux/rockylinux:${{ matrix.version }}
    steps:
    - uses: actions/checkout@v2

    - name: Check Tag
      id: check-tag
      run: |
        if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "match=true" >> $GITHUB_OUTPUT
        fi

    - name: Set version on a valid SemVer tag
      if: steps.check-tag.outputs.match == 'true'
      run: |
        # Extract the version part (e.g., 1.2.3)
        echo "VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')" >> $GITHUB_ENV

    - name: Set version on any other tag
      if: steps.check-tag.outputs.match != 'true'
      run: echo "VERSION=1.0.0" >> $GITHUB_ENV

    - name: install required rpm packages
      run: |
           dnf install -y ${{ matrix.python_pkg }} rpm-build nodejs
           alternatives --set python3 /usr/bin/python3.9 || true

    - name: Add a directory to the PATH
      run: echo "/usr/bin" >> $GITHUB_PATH
    
    - name: Install uv version 0.11.26
      env:
        UV_VERSION: 0.11.26
        UV_INSTALL_DIR: ${{runner.temp}}/uv
      run: |
           curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | env UV_INSTALL_DIR="${UV_INSTALL_DIR}" sh
           echo "${UV_INSTALL_DIR}" >> "$GITHUB_PATH"
           "${UV_INSTALL_DIR}/uv" --version

    - name: Uv Sync and Install Pyinstaller
      run: |
           cd hf-provider
           uv sync --locked
           uv pip install pyinstaller

    - name: run common unit tests
      env: 
           HF_PROVIDER_CONFDIR: ${{ github.workspace }}/hf-provider/tests/resources/provider-config/config-001/conf/providers/gcpgkeinst
      run: |
           cd hf-provider
           uv run --locked python -m pytest tests/unit/common

    - name: run gcpgce unit tests
      env: 
           HF_PROVIDER_CONFDIR: ${{ github.workspace }}/hf-provider/tests/resources/provider-config/config-001/conf/providers/gcpgceinst
      run: |
           cd hf-provider
           uv run --locked python -m pytest tests/unit/gce_provider

    - name: run gcpgke unit tests
      env: 
           HF_PROVIDER_CONFDIR: ${{ github.workspace }}/hf-provider/tests/resources/provider-config/config-001/conf/providers/gcpgkeinst
      run: |
           cd hf-provider
           uv run --locked python -m pytest tests/unit/gke_provider

    - name: build clis
      run: |
           cd hf-provider
           uv run --locked pyinstaller hf-gce.spec --clean
           uv run --locked pyinstaller hf-monitor.spec --clean
           uv run --locked pyinstaller hf-gke.spec --clean

    - name: run gce rpmbuild
      id: gce-rpm
      run: rpmbuild -bb hf-provider/resources/hf-gcpgce-provider.spec | grep Wrote |awk '{print "gce_rpm_path="$2}' >> $GITHUB_OUTPUT

    - name: Upload gce artifact
      uses: actions/upload-artifact@v4
      with:
        name: hf-gcpgce-provider-${{ env.VERSION }}-${{ github.run_number }}.el${{ matrix.version }}.x86_64.rpm
        path: "${{ steps.gce-rpm.outputs.gce_rpm_path }}"
        compression-level: 0

    - name: run gke rpmbuild
      id: gke-rpm
      run: rpmbuild -bb hf-provider/resources/hf-gcpgke-provider.spec | grep Wrote |awk '{print "gke_rpm_path="$2}' >> $GITHUB_OUTPUT

    - name: Upload gke artifact
      uses: actions/upload-artifact@v4
      with:
        name: hf-gcpgke-provider-${{ env.VERSION }}-${{ github.run_number }}.el${{ matrix.version }}.x86_64.rpm
        path: "${{ steps.gke-rpm.outputs.gke_rpm_path }}"
        compression-level: 0

