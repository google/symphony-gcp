---
name: Build k8s-operator
on: 
  workflow_dispatch:
  push:
    paths:
      - k8s-operator/**

permissions:
  contents: read

env:
  IMAGE: gcp-symphony-operator

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e #v2.8.0
        with:
          persist-credentials: false

      - name: Add a directory to the PATH
        run: echo "/usr/bin" >> $GITHUB_PATH

      - name: Run Tests
        run: |
          cd k8s-operator
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.12 --allow-existing
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          pytest tests
  
  check-tags:
    name: Check Tags
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - id: check
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  set-version:
    name: Set Version
    runs-on: ubuntu-24.04
    needs: check-tags
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - id: set_version
        env:
          IS_RELEASE: ${{ needs.check-tags.outputs.is_release }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
            VERSION=1.0.0-build.${GITHUB_RUN_NUMBER}-${SHORT_SHA}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build 
    runs-on: ubuntu-24.04
    needs: [unit-tests, check-tags, set-version]
    env:
      VERSION: ${{ needs.set-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU (Simulate multi-arch builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 #v6.19.2
        with:
          context: k8s-operator
          file: ./k8s-operator/Dockerfile
          platforms: linux/amd64
          push: false # NOTE: It's important to set push to false here to avoid pushing test images to the registry
          load: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          outputs: type=docker, dest=${{runner.temp}}/k8s-operator.tar

      - name: Upload Docker image artifact for debugging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: k8s-operator-image
          path: ${{runner.temp}}/k8s-operator.tar
          retention-days: 1


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: [build, set-version]
    env:
      VERSION: ${{ needs.set-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          persist-credentials: false

      - name: Download Docker image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          name: k8s-operator-image
          path: ${{ runner.temp }}

      - name: Check Downloaded artifact
        run: |
          if [ -f ${{ runner.temp }}/k8s-operator.tar ]; then
            echo "Docker image artifact downloaded successfully."
          else
            echo "Failed to download Docker image artifact." && exit 1
          fi

      - name: Load Docker image
        run: |
          docker load -i ${{ runner.temp }}/k8s-operator.tar
      
      - name: Run Integration Tests
        run: |
          echo "Running integration tests..."
      
      - name: Verify Docker image
        run: |
          if docker images "$IMAGE:$VERSION" | grep -q "$IMAGE"; then
            echo "Docker image $IMAGE:$VERSION is available."
          else
            echo "Docker image $IMAGE:$VERSION not found." && exit 1
          fi

      - name: Run export-manifests
        run: |
          docker run --rm "$IMAGE:$VERSION" export-manifests > manifests.yaml

      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc #v1.14.0
        with:
          version: v0.17.0
          cluster_name: symphony-operator-test-cluster

      - name: Load Docker image into Kind cluster
        run: |
          kind load docker-image "$IMAGE:$VERSION" --name symphony-operator-test-cluster
        
      - name: Modify manifests to use localhost image registry
        run: |
          sed "s|image: gcp-symphony-operator:.*|image: $IMAGE:$VERSION|" manifests.yaml \
          | kubectl apply -f -
      
      - name: Set namespace to gcp-symphony
        run: |
          kubectl config set-context --current --namespace=gcp-symphony

      - name: Set Operator Retain Time to 2 minutes for testing and then restart operator
        run: |
          kubectl set env "deploy/$IMAGE" \
            GCP_HF_CRD_COMPLETED_RETAIN_TIME=2 \
            GCP_HF_CRD_COMPLETED_CHECK_INTERVAL=1 \
            GCP_HF_POD_GRACE_PERIOD=10 \
            GCP_HF_HEALTH_CHECK_ENABLED=True
          kubectl rollout restart "deploy/$IMAGE"

      - name: Run kind integration tests
        run: bash ./k8s-operator/tests/ci/run-kind-tests.sh


  push:
    name: Push to Registry
    needs: [integration-tests, check-tags, set-version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.set-version.outputs.version }}
      REGISTRY: "gcp-symphony-registry" # TODO: Update with actual registry

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          name: k8s-operator-image
          path: ${{ runner.temp }}

      - name: Check Downloaded artifact
        run: |
          if [ -f ${{ runner.temp }}/k8s-operator.tar ]; then
            echo "Docker image artifact downloaded successfully."
          else
            echo "Failed to download Docker image artifact." && exit 1
          fi

      - name: Load Docker image
        run: |
          docker load -i ${{ runner.temp }}/k8s-operator.tar
        
      - name: Tag version image
        run: |
          docker tag "$IMAGE:$VERSION" "$REGISTRY/$IMAGE:$VERSION"
        
      - name: Push version image to registry
        run: |
          echo "Pushing image $REGISTRY/$IMAGE:$VERSION to registry..."

      - name: Tag latest image
        if: needs.check-tags.outputs.is_release == 'true'
        run: |
          docker tag "$IMAGE:$VERSION" "$REGISTRY/$IMAGE:latest"
      
      - name: Push latest image to registry
        if: needs.check-tags.outputs.is_release == 'true'
        run: |
          echo "Pushing image $REGISTRY/$IMAGE:latest to registry..."